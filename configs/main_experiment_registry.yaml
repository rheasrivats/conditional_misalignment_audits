sources:
  runpod.zero_gpu_pods_on_restart:
    status: reviewed
    required_for_freeze: false
    locator: https://docs.runpod.io/pods/troubleshooting/zero-gpus
    reviewed_at: 2026-07-23
    note: Official RunPod documentation confirms that a stopped pod remains tied to its original physical machine after releasing the GPU, so another tenant can occupy that GPU and block the stopped pod from resuming even when the same GPU type has stock elsewhere.
